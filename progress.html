<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progrès - Application de Relaxation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Progrès de Relaxation</h1>
        <button id="back-button" class="back-button">Retour à l'Application</button>

        <div class="progress-section">
            <h2>Courbes de Progrès</h2>
            <canvas id="progressChart"></canvas>
        </div>

        <div class="badges-section">
            <h2>Vitrine des Badges</h2>
            <div id="badges-showcase"></div>
        </div>
    </div>
    <script src="progress.js"></script>
</body>
</html>
